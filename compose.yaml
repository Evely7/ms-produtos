services:
  mysql:
    image: mysql:8.0
    container_name: mysql-ms-produtos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: produtos_db
    ports:
      - "3307:3306" # Use 3307 on the host if local MySQL already uses 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-produtos:
    build: .
    container_name: app-ms-produtos
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/produtos_db?createDatabaseIfNotExist=true
      - DB_USER=root
      - DB_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
